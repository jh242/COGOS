name: COGOS
options:
  bundleIdPrefix: com.jackhu
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

# Keep ci_scripts in the project navigator so Xcode Cloud always finds them.
fileGroups:
  - ci_scripts

packages:
  SwiftAgent:
    url: https://github.com/SwiftedMind/SwiftAgent
    revision: 48bfda9219a5014c117aff3294e7987e17218a9d
  SwiftMail:
    url: https://github.com/Cocoanetics/SwiftMail
    exactVersion: 1.11.0

# Project-wide so SwiftAgent's generated macro target inherits it on Cloud.
settings:
  base:
    SWIFT_ENABLE_EXPLICIT_MODULES: "NO"

targets:
  COGOS:
    type: application
    platform: iOS
    sources:
      - path: COGOS
        excludes:
          - README.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackhu.cogos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GQNYY47R5M
        SWIFT_OBJC_BRIDGING_HEADER: COGOS/Supporting/COGOS-Bridging-Header.h
        INFOPLIST_FILE: COGOS/Supporting/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_ENABLE_EXPLICIT_MODULES: "NO"
    dependencies:
      - sdk: WeatherKit.framework
      - package: SwiftAgent
        product: OpenAISession
      - package: SwiftMail
        product: SwiftMail
    entitlements:
      path: COGOS/Supporting/COGOS.entitlements
      properties:
        com.apple.developer.weatherkit: true

  COGOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: COGOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackhu.cogos.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: COGOS
      - package: SwiftMail
        product: SwiftMail

# Shared scheme (xcshareddata), not laptop xcuserdata. Cloud Archive uses
# `xcodebuild archive -scheme COGOS`; Archive pre-actions run before
# ComputeTargetDependencyGraph, which is where SwiftAgentMacros is gated.
schemes:
  COGOS:
    build:
      targets:
        COGOS: all
        COGOSTests: [test]
      preActions:
        - name: Enable SwiftAgentMacros
          settingsTarget: COGOS
          script: |
            /bin/sh "${SRCROOT}/ci_scripts/enable_swiftagent_macros.sh"
    test:
      targets:
        - COGOSTests
    archive:
      config: Release
      preActions:
        - name: Enable SwiftAgentMacros
          settingsTarget: COGOS
          script: |
            /bin/sh "${SRCROOT}/ci_scripts/enable_swiftagent_macros.sh"
