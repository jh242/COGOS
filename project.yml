name: COGOS
options:
  bundleIdPrefix: com.jackhu
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

# Keep ci_scripts in the project navigator so Xcode Cloud always finds them.
fileGroups:
  - ci_scripts

packages:
  SwiftAgent:
    url: https://github.com/SwiftedMind/SwiftAgent
    revision: 48bfda9219a5014c117aff3294e7987e17218a9d
  SwiftMail:
    url: https://github.com/Cocoanetics/SwiftMail
    exactVersion: 1.11.0

targets:
  COGOS:
    type: application
    platform: iOS
    sources:
      - path: COGOS
        excludes:
          - README.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackhu.cogos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: GQNYY47R5M
        SWIFT_OBJC_BRIDGING_HEADER: COGOS/Supporting/COGOS-Bridging-Header.h
        INFOPLIST_FILE: COGOS/Supporting/Info.plist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - sdk: WeatherKit.framework
      - package: SwiftAgent
        product: OpenAISession
      - package: SwiftMail
        product: SwiftMail
    entitlements:
      path: COGOS/Supporting/COGOS.entitlements
      properties:
        com.apple.developer.weatherkit: true
    scheme:
      testTargets:
        - COGOSTests
      preActions:
        - name: Trust SwiftAgent macros
          script: |
            "${SRCROOT}/ci_scripts/trust_macros.sh"
          settingsTarget: COGOS

  COGOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: COGOSTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jackhu.cogos.tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: COGOS
      - package: SwiftMail
        product: SwiftMail
